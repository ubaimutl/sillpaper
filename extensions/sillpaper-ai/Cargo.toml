[package]
name = "sillpaper-ai"
version = "0.1.0"
edition = "2024"
authors = ["Ubai <ob.mtl97@gmail.com>"]
description = "Optional standalone AI writing extension for Sillpaper"
license = "MIT"
repository = "https://github.com/ubaimutl/sillpaper"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
